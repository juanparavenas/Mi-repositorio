name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Modelo de datos (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del modelo de datos
        run: supabase/tests/run.sh

  exclusion-policy:
    name: Política de exclusión y contraste del diseño
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del clasificador, sincronía con la base y contraste del diseño
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Contraste WCAG de los tokens (claro y oscuro)
        run: python3 scripts/check_contrast.py

  web:
    name: Aplicación web (lint, tipos, pruebas, compilación y extremo a extremo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Compilación
        run: pnpm build
      - name: Navegador para las pruebas
        run: pnpm --filter @cmf/web exec playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (escritorio y teléfono, accesibilidad WCAG 2.2 AA)
        run: pnpm e2e

  docs:
    name: Enlaces de la documentación
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar enlaces relativos
        run: python3 scripts/check_docs_links.py

  secrets:
    name: Búsqueda de secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
